<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>9-Tsubo House — 4-Mode WebXR (Browser 3D · Quest VR · 1:1 AR · Dollhouse AR)</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0; overflow: hidden; background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none; color: #f3f4f6;
    }

    /* DOM Overlay container stays visible and interactive in WebXR immersive-ar on Android Chrome */
    #ui-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 20;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 16px) 12px;
    }

    .top-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; width: 100%; max-width: 1120px; margin: 0 auto;
    }

    .brand-pill {
      pointer-events: auto;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(18, 18, 20, 0.80); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 13px; font-weight: 600;
    }
    .mode-badge {
      padding: 3px 9px; border-radius: 999px;
      background: rgba(56, 189, 248, 0.20); color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    }

    /* 4-Mode Switcher + Layer Toggles */
    .mode-toolbar {
      pointer-events: auto;
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 6px; border-radius: 16px;
      background: rgba(18, 18, 20, 0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .mode-btn, .toggle-btn {
      appearance: none; border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06); color: #e5e7eb;
      padding: 7px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn:hover, .toggle-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .mode-btn.active {
      background: #f8fafc; color: #0f172a; border-color: #fff;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.22);
    }
    .toggle-btn.on {
      background: rgba(244, 114, 182, 0.22); color: #fbcfe8;
      border-color: rgba(244, 114, 182, 0.45);
    }
    .exit-xr-btn {
      background: rgba(239, 68, 68, 0.85); color: #fff; border-color: rgba(252, 165, 165, 0.5);
      display: none;
    }

    /* Center status banner for AR hit-test / instructions */
    #status-toast {
      pointer-events: none;
      align-self: center; margin-top: auto; margin-bottom: 10px;
      padding: 8px 16px; border-radius: 999px;
      background: rgba(15, 23, 42, 0.84); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 12.5px; color: #e2e8f0; text-align: center;
      max-width: 90vw; transition: opacity 0.25s;
    }

    /* Dollhouse Tabletop AR Extra Controls */
    #dollhouse-controls {
      pointer-events: auto;
      align-self: center; margin-bottom: 8px;
      display: none; gap: 6px; flex-wrap: wrap; justify-content: center;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(18, 18, 20, 0.82); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Bottom Room Selector Bar (matches GachaHouse / Haikei House style) */
    #rooms {
      pointer-events: auto;
      align-self: center;
      display: flex; gap: 6px; max-width: 96vw;
      overflow-x: auto; padding: 8px 10px; border-radius: 999px;
      background: rgba(18, 18, 18, 0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      scrollbar-width: none;
    }
    #rooms::-webkit-scrollbar { display: none; }
    .room-btn {
      appearance: none; border: none; background: transparent;
      color: #ccc; padding: 8px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .room-btn:hover { color: #fff; }
    .room-btn.active { background: #fff; color: #111; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui-overlay">
    <div class="top-bar">
      <div class="brand-pill">
        <span>9-Tsubo House (Sumire Aoi)</span>
        <span id="mode-badge" class="mode-badge">Mode 1 · Browser 3D</span>
      </div>

      <div class="mode-toolbar">
        <button id="btn-mode-browser" class="mode-btn active" title="Standard 3D OrbitControls + Preset Room Camera Transitions">1 · Browser 3D</button>
        <button id="btn-mode-vr" class="mode-btn" title="Meta Quest 3 / Quest Pro Full Immersive VR (local-floor)">2 · Full VR (Quest)</button>
        <button id="btn-mode-ar-walk" class="mode-btn" title="Pixel 10 Pro 1:1 Scale AR Room Walkthrough with DOM Overlay">3 · 1:1 AR Walkthrough</button>
        <button id="btn-mode-ar-doll" class="mode-btn" title="Tabletop Miniature Dollhouse AR (0.05x Scale, Roof & Context Hidden)">4 · Dollhouse AR</button>
        <button id="btn-toggle-roof" class="toggle-btn on" title="Toggle Roof_Group visibility">Roof: On</button>
        <button id="btn-toggle-ctx" class="toggle-btn on" title="Toggle Context_Group visibility">Context: On</button>
        <button id="btn-exit-xr" class="mode-btn exit-xr-btn">Exit XR</button>
      </div>
    </div>

    <div id="status-toast">Loading 9_tsubo_house.glb…</div>

    <div id="dollhouse-controls">
      <button id="btn-scale-down" class="toggle-btn">Scale −</button>
      <button id="btn-scale-reset" class="toggle-btn on">Scale: 1:20 (0.05×)</button>
      <button id="btn-scale-up" class="toggle-btn">Scale +</button>
      <button id="btn-rot-left" class="toggle-btn">↺ Rotate 45°</button>
      <button id="btn-re-place" class="toggle-btn">Re-place on Surface</button>
    </div>

    <nav id="rooms"></nav>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. PRESET ROOM WAYPOINTS (Synchronized with Blender WP_* Empties)
    // Coordinates in Three.js space (+Y Up, +Z South/Front, -Z North/Back, +X East)
    // =========================================================================
    const ROOMS = [
      {
        id: 'WP_01_Exterior_Front',
        name: 'Exterior Front',
        floorPos: [-2.60, 0.00, 7.20],
        eyePos:   [-2.60, 1.60, 7.20],
        target:   [ 0.00, 2.00, 1.50],
        yaw:      -0.428
      },
      {
        id: 'WP_02_Sakura_Deck',
        name: 'Sakura Deck',
        floorPos: [ 0.85, 0.36, 3.55],
        eyePos:   [ 0.85, 1.96, 3.55],
        target:   [-0.40, 1.85, 0.50],
        yaw:       0.389
      },
      {
        id: 'WP_03_Living_Dining',
        name: 'Living & Dining',
        floorPos: [-1.65, 0.36, 1.75],
        eyePos:   [-1.65, 1.96, 1.75],
        target:   [ 0.40, 1.95, -0.10],
        yaw:      -0.837
      },
      {
        id: 'WP_04_Kitchen',
        name: 'Kitchen',
        floorPos: [ 1.55, 0.36, 1.10],
        eyePos:   [ 1.55, 1.96, 1.10],
        target:   [-1.20, 1.85, 1.50],
        yaw:       1.715
      },
      {
        id: 'WP_05_Tatami_Room',
        name: 'Tatami Room',
        floorPos: [-0.65, 0.52, -0.95],
        eyePos:   [-0.65, 2.12, -0.95],
        target:   [-0.75, 1.25, -2.50],
        yaw:       0.064
      },
      {
        id: 'WP_06_Bathroom',
        name: 'Bathroom',
        floorPos: [ 1.52, 0.36, -0.45],
        eyePos:   [ 1.52, 1.96, -0.45],
        target:   [ 1.75, 1.55, -2.10],
        yaw:      -0.138
      },
      {
        id: 'WP_07_Loft_Lounge',
        name: '2F Loft Lounge',
        floorPos: [ 1.45, 2.52, 1.35],
        eyePos:   [ 1.45, 4.12, 1.35],
        target:   [-0.50, 3.30, -1.10],
        yaw:       0.672
      },
      {
        id: 'WP_08_Bedroom_2F',
        name: '2F Bedroom',
        floorPos: [-1.20, 2.52, -0.65],
        eyePos:   [-1.20, 4.12, -0.65],
        target:   [ 0.05, 3.45, -2.40],
        yaw:      -0.620
      },
      {
        id: 'WP_09_Kitty_Window',
        name: 'Kitty Window',
        floorPos: [-0.22, 2.52, -1.55],
        eyePos:   [-0.22, 3.45, -1.55],
        target:   [-0.14, 3.45, -6.53],
        yaw:      -0.016
      },
      {
        id: 'WP_10_Overview',
        name: 'Neighborhood Overview',
        floorPos: [-10.50, 0.00, 14.50],
        eyePos:   [-10.50, 10.20, 14.50],
        target:   [ 0.80, 1.80,  1.20],
        yaw:      -0.704
      }
    ];

    // =========================================================================
    // 2. SCENE, RENDERER & QUEST PRO PERFORMANCE GUARDRAILS
    // =========================================================================
    const skyColor = new THREE.Color(0x87ceeb);
    const scene = new THREE.Scene();
    scene.background = skyColor;
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.010);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.04, 160);
    camera.rotation.order = 'YXZ';

    // Camera Rig for VR locomotion & room teleportation
    const rig = new THREE.Group();
    rig.name = 'XR_Camera_Rig';
    rig.add(camera);
    scene.add(rig);

    // Root container for the GLB house + context so AR modes can anchor/scale the model cleanly
    const worldRoot = new THREE.Group();
    worldRoot.name = 'World_Root';
    scene.add(worldRoot);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    // Guardrail 1: Cap devicePixelRatio at 2 on high-DPI mobile screens (Pixel 10 Pro)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    // Guardrail 2: Enable maximum fixed foveated rendering (1.0) for Quest Pro / Quest 3
    if (typeof renderer.xr.setFoveation === 'function') {
      renderer.xr.setFoveation(1.0);
    }
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // OrbitControls for Mode 1 (Browser 3D)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.maxDistance = 65;
    controls.minDistance = 0.25;

    // Lighting (Outdoor Sun + Sky Hemisphere + Warm Interior Fill Lights)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x554433, 1.55);
    hemiLight.position.set(0, 25, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff4e0, 2.1);
    dirLight.position.set(-14, 24, 18);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 60;
    const d = 16;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // Warm interior fill lights attached to worldRoot so they scale/move with the house in AR
    const intLight1F = new THREE.PointLight(0xffe6c2, 1.8, 8.0, 1.2);
    intLight1F.position.set(-0.2, 2.25, 0.2);
    worldRoot.add(intLight1F);

    const intLight2F = new THREE.PointLight(0xffebd0, 1.6, 8.0, 1.2);
    intLight2F.position.set(0.0, 4.15, -0.5);
    worldRoot.add(intLight2F);

    // Guardrail 3: Helper to toggle real-time shadows off in immersive-ar modes
    function setShadowsEnabled(enabled) {
      renderer.shadowMap.enabled = enabled;
      dirLight.castShadow = enabled;
    }

    // =========================================================================
    // 3. LOAD 9_TSUBO_HOUSE.GLB & BIND ROOF_GROUP / CONTEXT_GROUP
    // =========================================================================
    let roofGroup = null;
    let contextGroup = null;
    let houseGroup = null;
    const walkableMeshes = [];
    const statusToast = document.getElementById('status-toast');

    function showToast(msg, durationMs = 4200) {
      statusToast.textContent = msg;
      statusToast.style.opacity = '1';
      if (durationMs > 0) {
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          statusToast.style.opacity = '0';
        }, durationMs);
      }
    }

    const loader = new GLTFLoader();
    loader.load(
      './9_tsubo_house.glb',
      (gltf) => {
        const model = gltf.scene;
        roofGroup = model.getObjectByName('Roof_Group');
        contextGroup = model.getObjectByName('Context_Group');
        houseGroup = model.getObjectByName('House_Group');

        // Sync any exported WP_* Empty nodes from Blender if present
        const wpGroup = model.getObjectByName('Waypoints_Group');
        if (wpGroup) {
          wpGroup.children.forEach((wp) => {
            const match = ROOMS.find((r) => r.id === wp.name);
            if (match) {
              const worldPos = new THREE.Vector3();
              wp.getWorldPosition(worldPos);
              match.eyePos = [worldPos.x, worldPos.y, worldPos.z];
            }
          });
        }

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            walkableMeshes.push(child);

            if (child.material) {
              const mName = child.material.name || '';
              if (mName.includes('Glass') || mName.includes('Trans')) {
                child.material.transparent = true;
                child.material.opacity = 0.24;
                child.material.depthWrite = false;
              } else if (mName.includes('Shoji')) {
                child.material.transparent = true;
                child.material.opacity = 0.92;
              }
            }
          }
        });

        worldRoot.add(model);
        updateGroupTogglesUI();
        showToast('Loaded 9-Tsubo House · Select any room below or launch VR / AR modes above');
      },
      (xhr) => {
        if (xhr.total) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          statusToast.textContent = `Loading 9_tsubo_house.glb (${pct}%)…`;
        }
      },
      (err) => {
        console.error('Error loading GLB:', err);
        showToast('Failed to load ./9_tsubo_house.glb', 0);
      }
    );

    // =========================================================================
    // 4. ROOF_GROUP & CONTEXT_GROUP VISIBILITY CONTROLS
    // =========================================================================
    const btnToggleRoof = document.getElementById('btn-toggle-roof');
    const btnToggleCtx = document.getElementById('btn-toggle-ctx');

    function setGroupVisibility(showRoof, showContext) {
      if (roofGroup) roofGroup.visible = showRoof;
      if (contextGroup) contextGroup.visible = showContext;
      updateGroupTogglesUI();
    }

    function updateGroupTogglesUI() {
      const rVis = roofGroup ? roofGroup.visible : true;
      const cVis = contextGroup ? contextGroup.visible : true;
      btnToggleRoof.textContent = `Roof: ${rVis ? 'On' : 'Off'}`;
      btnToggleRoof.classList.toggle('on', rVis);
      btnToggleCtx.textContent = `Context: ${cVis ? 'On' : 'Off'}`;
      btnToggleCtx.classList.toggle('on', cVis);
    }

    btnToggleRoof.addEventListener('click', (e) => {
      e.stopPropagation();
      if (roofGroup) setGroupVisibility(!roofGroup.visible, contextGroup ? contextGroup.visible : true);
    });

    btnToggleCtx.addEventListener('click', (e) => {
      e.stopPropagation();
      if (contextGroup) setGroupVisibility(roofGroup ? roofGroup.visible : true, !contextGroup.visible);
    });

    // =========================================================================
    // 5. FOUR-MODE STATE MACHINE & ROOM TRANSITIONS
    // =========================================================================
    const MODES = {
      BROWSER_3D: 'BROWSER_3D',
      FULL_VR: 'FULL_VR',
      AR_WALKTHROUGH: 'AR_WALKTHROUGH',
      AR_DOLLHOUSE: 'AR_DOLLHOUSE'
    };

    let activeMode = MODES.BROWSER_3D;
    let currentRoomIndex = 0;

    // Smooth camera interpolation state for Mode 1 (Browser 3D)
    const camAnim = {
      active: false,
      t: 0,
      duration: 0.65,
      startPos: new THREE.Vector3(),
      endPos: new THREE.Vector3(),
      startTarget: new THREE.Vector3(),
      endTarget: new THREE.Vector3()
    };

    controls.addEventListener('start', () => {
      camAnim.active = false;
    });

    // Anchor selected room to the user's real-world floor position in Mode 3 (1:1 AR Walkthrough)
    function anchorRoomToARUser(index) {
      const room = ROOMS[index];
      const xrCam = renderer.xr.getCamera();
      const userPos = new THREE.Vector3();
      xrCam.getWorldPosition(userPos);

      // Keep worldRoot at 1:1 scale and align the room's floorPos under the user's current floor (userPos.x, 0, userPos.z)
      worldRoot.scale.set(1, 1, 1);
      worldRoot.rotation.set(0, -room.yaw, 0);

      const roomFloorVec = new THREE.Vector3(room.floorPos[0], room.floorPos[1], room.floorPos[2]);
      roomFloorVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), -room.yaw);

      worldRoot.position.set(
        userPos.x - roomFloorVec.x,
        -roomFloorVec.y,
        userPos.z - roomFloorVec.z
      );
    }

    function goToRoom(index, instant = false) {
      currentRoomIndex = ((index % ROOMS.length) + ROOMS.length) % ROOMS.length;
      const room = ROOMS[currentRoomIndex];

      document.querySelectorAll('.room-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === currentRoomIndex);
      });
      updateVRHudCanvas();

      if (activeMode === MODES.FULL_VR && renderer.xr.isPresenting) {
        // Mode 2 (Quest VR): Move rig to the room's floor coordinates and orient yaw
        rig.position.set(room.floorPos[0], room.floorPos[1], room.floorPos[2]);
        rig.rotation.set(0, room.yaw, 0);
        showToast(`VR Room: ${room.name}`);
      } else if (activeMode === MODES.AR_WALKTHROUGH && renderer.xr.isPresenting) {
        // Mode 3 (Pixel 10 Pro 1:1 AR Walkthrough): Anchor room floor waypoint to user's floor origin
        anchorRoomToARUser(currentRoomIndex);
        showToast(`1:1 AR Anchored: ${room.name} — Walk around physically!`);
      } else if (activeMode === MODES.AR_DOLLHOUSE && renderer.xr.isPresenting) {
        // Mode 4 (Dollhouse AR): Highlight or rotate tabletop model toward the selected room
        showToast(`Dollhouse Focus: ${room.name}`);
      } else {
        // Mode 1 (Browser 3D): Smoothly transition OrbitControls camera & target
        rig.position.set(0, 0, 0);
        rig.rotation.set(0, 0, 0);
        if (instant) {
          camera.position.set(room.eyePos[0], room.eyePos[1], room.eyePos[2]);
          controls.target.set(room.target[0], room.target[1], room.target[2]);
          controls.update();
          camAnim.active = false;
        } else {
          camAnim.startPos.copy(camera.position);
          camAnim.endPos.set(room.eyePos[0], room.eyePos[1], room.eyePos[2]);
          camAnim.startTarget.copy(controls.target);
          camAnim.endTarget.set(room.target[0], room.target[1], room.target[2]);
          camAnim.t = 0;
          camAnim.active = true;
        }
      }
    }

    // Build HTML Room Buttons
    const roomsNav = document.getElementById('rooms');
    ROOMS.forEach((room, index) => {
      const btn = document.createElement('button');
      btn.className = 'room-btn';
      btn.textContent = room.name;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        goToRoom(index, false);
      });
      roomsNav.appendChild(btn);
    });

    // =========================================================================
    // 6. IN-VR 3D HUD MENU & CONTROLLER RAYCASTER (Mode 2: Quest 3 / Quest Pro)
    // =========================================================================
    const hudCanvas = document.createElement('canvas');
    hudCanvas.width = 640;
    hudCanvas.height = 220;
    const hudCtx = hudCanvas.getContext('2d');
    const hudTex = new THREE.CanvasTexture(hudCanvas);

    const vrHudMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(0.68, 0.23),
      new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, side: THREE.DoubleSide })
    );
    vrHudMesh.position.set(0, 1.08, -0.78);
    vrHudMesh.rotation.x = -0.38;
    vrHudMesh.visible = false;
    rig.add(vrHudMesh);

    function updateVRHudCanvas() {
      hudCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
      hudCtx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      hudCtx.strokeStyle = 'rgba(125, 211, 252, 0.65)';
      hudCtx.lineWidth = 4;
      hudCtx.beginPath();
      hudCtx.roundRect(6, 6, hudCanvas.width - 12, hudCanvas.height - 12, 24);
      hudCtx.fill();
      hudCtx.stroke();

      const room = ROOMS[currentRoomIndex];
      hudCtx.fillStyle = '#7dd3fc';
      hudCtx.font = 'bold 20px sans-serif';
      hudCtx.fillText('9-TSUBO HOUSE · QUEST VR HUD', 28, 42);

      hudCtx.fillStyle = '#ffffff';
      hudCtx.font = 'bold 30px sans-serif';
      hudCtx.fillText(`Room (${currentRoomIndex + 1}/${ROOMS.length}): ${room.name}`, 28, 86);

      hudCtx.fillStyle = '#cbd5e1';
      hudCtx.font = '19px sans-serif';
      hudCtx.fillText('• Press A / X or Pull Trigger to cycle to Next Room', 28, 128);
      hudCtx.fillText('• Press B / Y for Previous Room · Left Stick: Walk · Right Stick: Turn', 28, 160);
      hudCtx.fillText('• Point laser at this HUD & Trigger to toggle Roof cutaway', 28, 192);
      hudTex.needsUpdate = true;
    }
    updateVRHudCanvas();

    // Controller laser pointers for VR & Passthrough AR
    const controller0 = renderer.xr.getController(0);
    const controller1 = renderer.xr.getController(1);
    const laserGeom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -3.0)
    ]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });
    const laser0 = new THREE.Line(laserGeom, laserMat);
    const laser1 = new THREE.Line(laserGeom, laserMat);
    controller0.add(laser0);
    controller1.add(laser1);
    rig.add(controller0);
    rig.add(controller1);

    // =========================================================================
    // 7. HIT-TEST RETICLE & DOLLHOUSE TABLETOP CONTROLS (Mode 4)
    // =========================================================================
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let dollhousePlaced = false;
    let dollhouseScale = 0.05; // 1:20 miniature architectural scale

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.09, 0.12, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
    );
    const reticleDot = new THREE.Mesh(
      new THREE.CircleGeometry(0.025, 20).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xf472b6, side: THREE.DoubleSide })
    );
    reticle.add(reticleDot);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    const dollhouseControls = document.getElementById('dollhouse-controls');
    const btnScaleReset = document.getElementById('btn-scale-reset');

    function applyDollhouseScale(newScale) {
      dollhouseScale = THREE.MathUtils.clamp(newScale, 0.02, 0.20);
      worldRoot.scale.setScalar(dollhouseScale);
      const ratio = Math.round(1 / dollhouseScale);
      btnScaleReset.textContent = `Scale: 1:${ratio} (${dollhouseScale.toFixed(2)}×)`;
    }

    document.getElementById('btn-scale-down').addEventListener('click', (e) => {
      e.stopPropagation();
      applyDollhouseScale(dollhouseScale - 0.01);
    });
    document.getElementById('btn-scale-up').addEventListener('click', (e) => {
      e.stopPropagation();
      applyDollhouseScale(dollhouseScale + 0.01);
    });
    btnScaleReset.addEventListener('click', (e) => {
      e.stopPropagation();
      applyDollhouseScale(0.05);
    });
    document.getElementById('btn-rot-left').addEventListener('click', (e) => {
      e.stopPropagation();
      worldRoot.rotation.y += Math.PI / 4;
    });
    document.getElementById('btn-re-place').addEventListener('click', (e) => {
      e.stopPropagation();
      dollhousePlaced = false;
      showToast('Point at a surface and tap / pull trigger to place the Dollhouse');
    });

    // =========================================================================
    // 8. WEBXR SESSION LAUNCHERS FOR MODES 1, 2, 3, AND 4
    // =========================================================================
    const modeBadge = document.getElementById('mode-badge');
    const btnModeBrowser = document.getElementById('btn-mode-browser');
    const btnModeVR = document.getElementById('btn-mode-vr');
    const btnModeARWalk = document.getElementById('btn-mode-ar-walk');
    const btnModeARDoll = document.getElementById('btn-mode-ar-doll');
    const btnExitXR = document.getElementById('btn-exit-xr');

    function setActiveModeButton(mode) {
      activeMode = mode;
      btnModeBrowser.classList.toggle('active', mode === MODES.BROWSER_3D);
      btnModeVR.classList.toggle('active', mode === MODES.FULL_VR);
      btnModeARWalk.classList.toggle('active', mode === MODES.AR_WALKTHROUGH);
      btnModeARDoll.classList.toggle('active', mode === MODES.AR_DOLLHOUSE);

      const labels = {
        [MODES.BROWSER_3D]: 'Mode 1 · Browser 3D',
        [MODES.FULL_VR]: 'Mode 2 · Full VR (Quest)',
        [MODES.AR_WALKTHROUGH]: 'Mode 3 · 1:1 AR Walkthrough',
        [MODES.AR_DOLLHOUSE]: 'Mode 4 · Dollhouse AR'
      };
      modeBadge.textContent = labels[mode];
      dollhouseControls.style.display = (mode === MODES.AR_DOLLHOUSE) ? 'flex' : 'none';
    }

    async function endCurrentXRSessionIfAny() {
      const currentSession = renderer.xr.getSession();
      if (currentSession) {
        await currentSession.end();
      }
    }

    // MODE 1: Browser 3D
    async function activateBrowser3DMode(dollhousePreview = false) {
      await endCurrentXRSessionIfAny();
      setActiveModeButton(MODES.BROWSER_3D);
      btnExitXR.style.display = 'none';
      vrHudMesh.visible = false;
      reticle.visible = false;

      scene.background = skyColor;
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.010);
      setShadowsEnabled(true);

      worldRoot.scale.set(1, 1, 1);
      worldRoot.position.set(0, 0, 0);
      worldRoot.rotation.set(0, 0, 0);
      rig.position.set(0, 0, 0);
      rig.rotation.set(0, 0, 0);

      if (dollhousePreview) {
        setGroupVisibility(false, false);
        dollhouseControls.style.display = 'flex';
        goToRoom(9, false); // Overview angle looking inside cutaway
      } else {
        setGroupVisibility(true, true);
        goToRoom(currentRoomIndex, false);
      }
    }

    // MODE 2: Full VR (Quest 3 / Quest Pro)
    async function startFullVRMode() {
      await endCurrentXRSessionIfAny();
      if (!('xr' in navigator)) {
        showToast('WebXR not available in this browser — previewing in Browser 3D');
        return;
      }
      try {
        const supported = await navigator.xr.isSessionSupported('immersive-vr');
        if (!supported) {
          showToast('immersive-vr not supported on this device (open on Meta Quest 3 / Quest Pro)');
          return;
        }
        const session = await navigator.xr.requestSession('immersive-vr', {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
        });
        setActiveModeButton(MODES.FULL_VR);
        scene.background = skyColor;
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.010);
        setShadowsEnabled(false); // Maximize 90Hz/120Hz framerate on Quest
        setGroupVisibility(true, true);

        worldRoot.scale.set(1, 1, 1);
        worldRoot.position.set(0, 0, 0);
        worldRoot.rotation.set(0, 0, 0);
        vrHudMesh.visible = true;
        laser0.visible = true;
        laser1.visible = true;

        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);
        if (typeof renderer.xr.setFoveation === 'function') renderer.xr.setFoveation(1.0);

        goToRoom(currentRoomIndex, true);
        showToast('Full VR Active · Press A/X or Trigger to cycle rooms');
      } catch (err) {
        console.error('Failed to start immersive-vr:', err);
        showToast(`VR Error: ${err.message}`);
      }
    }

    // MODE 3: 1:1 Scale AR Walkthrough (Pixel 10 Pro / Quest Passthrough)
    async function startARWalkthroughMode() {
      await endCurrentXRSessionIfAny();
      if (!('xr' in navigator)) {
        showToast('WebXR not available — open in Android Chrome (Pixel 10 Pro) or Quest Browser');
        return;
      }
      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          showToast('immersive-ar not supported on this device — open on Pixel 10 Pro or Quest 3/Pro');
          return;
        }
        const sessionInit = {
          optionalFeatures: ['local-floor', 'dom-overlay', 'hit-test'],
          domOverlay: { root: document.getElementById('ui-overlay') }
        };
        const session = await navigator.xr.requestSession('immersive-ar', sessionInit);

        setActiveModeButton(MODES.AR_WALKTHROUGH);
        // Guardrail: Disable background, fog, and expensive shadow maps in AR
        scene.background = null;
        scene.fog = null;
        setShadowsEnabled(false);

        // Keep Roof_Group visible for true 1:1 room ceiling, hide distant neighborhood context so real world surrounds house
        setGroupVisibility(true, false);
        vrHudMesh.visible = false;
        laser0.visible = false;
        laser1.visible = false;
        reticle.visible = false;
        btnExitXR.style.display = 'inline-block';

        rig.position.set(0, 0, 0);
        rig.rotation.set(0, 0, 0);

        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);
        if (typeof renderer.xr.setFoveation === 'function') renderer.xr.setFoveation(1.0);

        // Anchor the current room waypoint at 1:1 scale to the user's floor origin after first pose frame
        setTimeout(() => {
          anchorRoomToARUser(currentRoomIndex);
        }, 120);

        showToast('1:1 AR Walkthrough · Walk physically & tap room buttons below to jump rooms!');
      } catch (err) {
        console.error('Failed to start 1:1 AR Walkthrough:', err);
        showToast(`AR Error: ${err.message}`);
      }
    }

    // MODE 4: Dollhouse Tabletop AR (0.05x Scale, Hit-Test, Roof & Context Automatically Hidden)
    async function startARDollhouseMode() {
      await endCurrentXRSessionIfAny();
      // Always hide Roof_Group and Context_Group for Dollhouse mode as requested
      setGroupVisibility(false, false);
      setActiveModeButton(MODES.AR_DOLLHOUSE);

      if (!('xr' in navigator)) {
        // Desktop fallback: preview cutaway Dollhouse right in Browser 3D
        await activateBrowser3DMode(true);
        setActiveModeButton(MODES.AR_DOLLHOUSE);
        showToast('Dollhouse Cutaway Preview (Roof & Context Hidden) · Open on Pixel 10 Pro / Quest for Tabletop AR');
        return;
      }

      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          await activateBrowser3DMode(true);
          setActiveModeButton(MODES.AR_DOLLHOUSE);
          showToast('Dollhouse Cutaway Preview (Roof & Context Hidden) · Open on Pixel 10 Pro / Quest for Tabletop AR');
          return;
        }

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay', 'local-floor'],
          domOverlay: { root: document.getElementById('ui-overlay') }
        });

        scene.background = null;
        scene.fog = null;
        setShadowsEnabled(false);
        setGroupVisibility(false, false); // Automatically hide Roof_Group and Context_Group!

        vrHudMesh.visible = false;
        laser0.visible = true;
        laser1.visible = true;
        btnExitXR.style.display = 'inline-block';

        rig.position.set(0, 0, 0);
        rig.rotation.set(0, 0, 0);
        applyDollhouseScale(0.05);
        // Place initially 0.8m in front and 0.4m below eye until user taps a hit-test surface
        worldRoot.position.set(0, -0.45, -0.85);
        worldRoot.rotation.set(0, 0, 0);
        dollhousePlaced = false;
        hitTestSourceRequested = false;
        hitTestSource = null;

        session.addEventListener('select', () => {
          if (activeMode === MODES.AR_DOLLHOUSE && reticle.visible) {
            worldRoot.position.setFromMatrixPosition(reticle.matrix);
            dollhousePlaced = true;
            reticle.visible = false;
            showToast(`Placed 1:${Math.round(1 / dollhouseScale)} Dollhouse! Peer inside 1F & 2F rooms`);
          }
        });

        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);
        if (typeof renderer.xr.setFoveation === 'function') renderer.xr.setFoveation(1.0);

        showToast('Scan a table or floor and tap / trigger to place the 1:20 Dollhouse model!');
      } catch (err) {
        console.error('Failed to start Dollhouse AR:', err);
        showToast(`Dollhouse AR Error: ${err.message}`);
      }
    }

    // Bind Mode Buttons
    btnModeBrowser.addEventListener('click', (e) => { e.stopPropagation(); activateBrowser3DMode(false); });
    btnModeVR.addEventListener('click', (e) => { e.stopPropagation(); startFullVRMode(); });
    btnModeARWalk.addEventListener('click', (e) => { e.stopPropagation(); startARWalkthroughMode(); });
    btnModeARDoll.addEventListener('click', (e) => { e.stopPropagation(); startARDollhouseMode(); });
    btnExitXR.addEventListener('click', (e) => { e.stopPropagation(); activateBrowser3DMode(false); });

    // Clean up when an XR session ends (e.g., user presses system exit button)
    renderer.xr.addEventListener('sessionend', () => {
      hitTestSourceRequested = false;
      hitTestSource = null;
      reticle.visible = false;
      vrHudMesh.visible = false;
      btnExitXR.style.display = 'none';
      activateBrowser3DMode(false);
    });

    // Controller trigger in Full VR mode: either click VR HUD or cycle room
    const tempMatrix = new THREE.Matrix4();
    const vrRaycaster = new THREE.Raycaster();

    function onVRControllerSelect(event) {
      if (activeMode !== MODES.FULL_VR || !renderer.xr.isPresenting) return;
      const ctrl = event.target;
      tempMatrix.identity().extractRotation(ctrl.matrixWorld);
      vrRaycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
      vrRaycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      if (vrHudMesh.visible) {
        const hits = vrRaycaster.intersectObject(vrHudMesh, false);
        if (hits.length > 0 && roofGroup) {
          setGroupVisibility(!roofGroup.visible, contextGroup ? contextGroup.visible : true);
          return;
        }
      }
      goToRoom(currentRoomIndex + 1, true);
    }
    controller0.addEventListener('selectstart', onVRControllerSelect);
    controller1.addEventListener('selectstart', onVRControllerSelect);

    // Initialize default room in Browser 3D
    goToRoom(0, true);

    // =========================================================================
    // 9. MAIN RENDER LOOP (OrbitControls + Quest VR Locomotion + AR Hit-Test)
    // =========================================================================
    const clock = new THREE.Clock();
    const downRaycaster = new THREE.Raycaster();
    const downVector = new THREE.Vector3(0, -1, 0);
    const rayOrigin = new THREE.Vector3();
    const headPos = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    let snapReady = true;
    let nextBtnReady = true;
    let prevBtnReady = true;

    renderer.setAnimationLoop((timestamp, frame) => {
      const dt = Math.min(clock.getDelta(), 0.1);
      const session = renderer.xr.getSession();

      if (!session) {
        // MODE 1: Browser 3D smooth camera transition + OrbitControls damping
        if (camAnim.active) {
          camAnim.t = Math.min(1.0, camAnim.t + dt / camAnim.duration);
          const ease = 1.0 - Math.pow(1.0 - camAnim.t, 3);
          camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
          controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
          if (camAnim.t >= 1.0) camAnim.active = false;
        }
        controls.update();
      } else if (activeMode === MODES.FULL_VR) {
        // MODE 2: Meta Quest 3 / Quest Pro Locomotion + Button Room Cycling + Floor Tracking
        const xrCam = renderer.xr.getCamera();
        xrCam.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();
        right.crossVectors(forward, rig.up).normalize();

        let moveX = 0, moveZ = 0;
        let nextPressed = false;
        let prevPressed = false;

        for (const source of session.inputSources) {
          if (!source.gamepad) continue;
          const axes = source.gamepad.axes;
          const x = axes.length > 2 ? axes[2] : axes[0];
          const y = axes.length > 3 ? axes[3] : axes[1];

          if (source.handedness === 'left') {
            if (Math.abs(x) > 0.15) moveX = x;
            if (Math.abs(y) > 0.15) moveZ = y;
          } else if (source.handedness === 'right') {
            if (Math.abs(x) > 0.65) {
              if (snapReady) {
                rig.rotation.y -= Math.sign(x) * (Math.PI / 4);
                snapReady = false;
              }
            } else if (Math.abs(x) < 0.2) {
              snapReady = true;
            }
          }

          // A / X button (buttons[4]) -> Next room; B / Y button (buttons[5]) -> Previous room
          if (source.gamepad.buttons[4]?.pressed) nextPressed = true;
          if (source.gamepad.buttons[5]?.pressed) prevPressed = true;
        }

        if (nextPressed && nextBtnReady) {
          goToRoom(currentRoomIndex + 1, true);
          nextBtnReady = false;
        } else if (!nextPressed) {
          nextBtnReady = true;
        }

        if (prevPressed && prevBtnReady) {
          goToRoom(currentRoomIndex - 1, true);
          prevBtnReady = false;
        } else if (!prevPressed) {
          prevBtnReady = true;
        }

        const speed = 2.5;
        rig.position.addScaledVector(right, moveX * speed * dt);
        rig.position.addScaledVector(forward, -moveZ * speed * dt);

        if (walkableMeshes.length > 0) {
          xrCam.getWorldPosition(headPos);
          rayOrigin.set(headPos.x, rig.position.y + 0.95, headPos.z);
          downRaycaster.set(rayOrigin, downVector);
          downRaycaster.far = 1.8;

          const hits = downRaycaster.intersectObjects(walkableMeshes, false);
          if (hits.length > 0) {
            const targetY = hits[0].point.y;
            if (Math.abs(targetY - rig.position.y) < 0.65) {
              rig.position.y = THREE.MathUtils.lerp(rig.position.y, targetY, 12 * dt);
            }
          }
        }
      } else if (activeMode === MODES.AR_DOLLHOUSE && frame) {
        // MODE 4: Dollhouse Tabletop AR Hit-Test Reticle
        const referenceSpace = renderer.xr.getReferenceSpace();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource && !dollhousePlaced) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            if (pose) {
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
            }
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
